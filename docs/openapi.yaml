# =============================================================================
# BUSYAHU - CONTRATO REST FORMAL (OpenAPI 3.0 / Swagger)
# -----------------------------------------------------------------------------
# Objetivo: definir de forma estricta los 12 endpoints REST del sistema para
# garantizar PARIDAD TOTAL entre Backend Express (Node.js + TypeScript) y
# Backend FastAPI (Python). Ambos backends DEBEN responder con idénticas
# firmas JSON y códigos HTTP a lo aquí especificado.
#
# Módulos: Auth (3), Rutas (2), Asientos (2), Reservas (4), Admin (1).
# Códigos de estado cubiertos: 200, 201, 400, 401, 403, 404 y 500.
#
# Autenticación: Bearer token JWT (securityScheme 'bearerAuth'). Los endpoints
# públicos (register, login, búsqueda de rutas y mapa de asientos) declaran
# security: []. El resto requiere token; /api/admin/reportes exige rol 'admin'.
# =============================================================================
openapi: 3.0.3

info:
  title: BusYahu API - Contrato REST de Paridad
  version: 1.0.0
  description: |
    Especificación oficial de la API REST de BusYahu (plataforma global de
    reserva de pasajes en 11 redes de transporte internacional).

    Convenciones estrictas del contrato:

    * **Paridad**: los backends `express` (puerto 4000) y `fastapi`
      (puerto 8000) deben implementar EXACTAMENTE estas rutas, con las mismas
      propiedades JSON, tipos, enums y códigos HTTP. No se permiten campos
      adicionales ni omitidos.
    * **Identificadores**: `id`, `rutaId`, `asientoId` y `reservaId` son
      ObjectIds de MongoDB de 24 caracteres hexadecimales.
    * **Errores**: todos los errores (400, 401, 403, 404, 500) usan el
      envoltorio `ErrorResponse` de forma idéntica en ambos backends.
    * **Autenticación**: excepto los endpoints marcados como públicos, toda
      petición debe incluir el header `Authorization: Bearer <token>`.
      `/api/admin/reportes` además exige el rol `admin`.
    * **Moneda**: cada ruta expresa su moneda y símbolo según el país destino
      (EUR €, GBP £, USD $, CAD CA$, RUB ₽, CNY ¥, INR ₹, JPY ¥).
    * **Asientos**: la clase (`classType`) es `First` o `Standard`, y el estado
      (`status`) es `available` u `occupied`.
    * **Reservas**: el estado (`status`) de una reserva es `CONFIRMED` o
      `CANCELLED`. Al cancelar una reserva se liberan los asientos asociados.
  contact:
    name: Equipo BusYahu
  license:
    name: Uso académico - Programación 3 (ETec)
    url: https://github.com/BusYahu/busyahu
  x-parity-requirement: >
    Los 12 endpoints DEBEN existir y responder de forma idéntica en ambos
    backends. Contrato fuente de verdad: docs/openapi.yaml.

servers:
  - url: https://api-express.busyahu.dev
    description: Backend Express (Node.js + TypeScript) - Producción
  - url: https://api-fastapi.busyahu.dev
    description: Backend FastAPI (Python) - Producción

tags:
  - name: Auth
    description: Registro, autenticación y perfil de usuarios (JWT).
  - name: Rutas
    description: Búsqueda y consulta de rutas / viajes disponibles.
  - name: Asientos
    description: Mapa de asientos por unidad y ocupación de asientos.
  - name: Reservas
    description: Creación, consulta y cancelación de reservas (ticket QR).
  - name: Admin
    description: Reportes estadísticos exclusivos para el rol admin.

paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Registrar un nuevo pasajero
      description: >
        Crea una cuenta de pasajero (rol `user`). Los administradores solo se
        crean por seed. El password se almacena hasheado con bcrypt y nunca se
        expone en las respuestas. Público, no requiere token.
      operationId: authRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: 'María López'
              email: 'maria.lopez@example.com'
              password: 'Segura123!'
      responses:
        '201':
          description: Usuario creado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: '64a1e2d3c4b5a6f7e8d9c0b1'
                name: 'María López'
                email: 'maria.lopez@example.com'
                role: user
                createdAt: '2026-08-20T10:00:00.000Z'
        '400':
          description: Cuerpo inválido o email ya registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 400
                error: 'Bad Request'
                message: 'El email maria.lopez@example.com ya se encuentra registrado'
                path: '/api/auth/register'
                timestamp: '2026-08-27T14:00:01.000Z'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 500
                error: 'Internal Server Error'
                message: 'No se pudo registrar el usuario'
                path: '/api/auth/register'
                timestamp: '2026-08-27T14:00:02.000Z'

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Iniciar sesión y obtener token JWT
      description: >
        Valida las credenciales (email + password) y devuelve un token Bearer
        JWT con las credenciales del usuario y su tiempo de expiración en
        segundos. Público, no requiere token.
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: 'pasajero@busyahu.com'
              password: 'Pasajero123!'
      responses:
        '200':
          description: Autenticación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token: 'eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI2NGExZTJkM2M0YjVhNmY3ZThkOWMwYjEiLCJyb2xlIjoidXNlciJ9.signature_ejemplo'
                tokenType: Bearer
                expiresIn: 86400
                user:
                  id: '64a1e2d3c4b5a6f7e8d9c0b1'
                  name: 'Pasajero Demo'
                  email: 'pasajero@busyahu.com'
                  role: user
                  createdAt: '2026-08-20T10:05:00.000Z'
        '400':
          description: Cuerpo inválido (campos faltantes o formato incorrecto).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 400
                error: 'Bad Request'
                message: 'El campo email es obligatorio'
                path: '/api/auth/login'
                timestamp: '2026-08-27T14:01:00.000Z'
        '401':
          description: Credenciales incorrectas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 401
                error: 'Unauthorized'
                message: 'Credenciales inválidas'
                path: '/api/auth/login'
                timestamp: '2026-08-27T14:01:05.000Z'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 500
                error: 'Internal Server Error'
                message: 'No se pudo procesar la autenticación'
                path: '/api/auth/login'
                timestamp: '2026-08-27T14:01:06.000Z'

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Obtener el perfil del usuario autenticado
      description: >
        Devuelve el perfil del usuario dueño del token. Requiere header
        `Authorization: Bearer <token>`.
      operationId: authMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: '64a1e2d3c4b5a6f7e8d9c0b1'
                name: 'Pasajero Demo'
                email: 'pasajero@busyahu.com'
                role: user
                createdAt: '2026-08-20T10:05:00.000Z'
        '401':
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 401
                error: 'Unauthorized'
                message: 'Token inválido o expirado'
                path: '/api/auth/me'
                timestamp: '2026-08-27T14:02:00.000Z'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 500
                error: 'Internal Server Error'
                message: 'No se pudo obtener el perfil'
                path: '/api/auth/me'
                timestamp: '2026-08-27T14:02:01.000Z'

  /api/rutas:
    get:
      tags:
        - Rutas
      summary: Buscar rutas / viajes disponibles
      description: >
        Devuelve las rutas que coinciden con los filtros enviados. Al menos se
        recomienda enviar `originStationId` y `destinationStationId`; `date`
        filtra por fecha de salida. Público, no requiere token.
      operationId: rutasSearch
      security: []
      parameters:
        - name: countryCode
          in: query
          required: false
          description: 'Código de país ISO 3166-1 alpha-2 (ej: ES, FR, JP).'
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
          example: 'ES'
        - name: originStationId
          in: query
          required: false
          description: 'ID de la estación de origen (ej: ES-MAD).'
          schema:
            type: string
          example: 'ES-MAD'
        - name: destinationStationId
          in: query
          required: false
          description: 'ID de la estación de destino (ej: ES-BCN).'
          schema:
            type: string
          example: 'ES-BCN'
        - name: date
          in: query
          required: false
          description: 'Fecha de salida en formato AAAA-MM-DD.'
          schema:
            type: string
            format: date
          example: '2026-09-01'
        - name: page
          in: query
          required: false
          description: 'Número de página (desde 1).'
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          description: 'Cantidad de resultados por página (1-100).'
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: Lista de rutas encontradas y metadatos de paginación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutasResponse'
              example:
                data:
                  - id: '64e2a1b2c3d4e5f6a7b8c9d0'
                    train:
                      code: 'AVE-103'
                      name: 'Renfe S-103 Velaro'
                      type: 'Alta Velocidad'
                      countryCode: 'ES'
                    origin:
                      id: 'ES-MAD'
                      name: 'Madrid Puerta de Atocha'
                      city: 'Madrid'
                      countryCode: 'ES'
                    destination:
                      id: 'ES-BCN'
                      name: 'Barcelona Sants'
                      city: 'Barcelona'
                      countryCode: 'ES'
                    departureAt: '2026-09-01T08:00:00Z'
                    arrivalAt: '2026-09-01T10:30:00Z'
                    durationMinutes: 150
                    basePrice: 65.50
                    currency: 'EUR'
                    symbol: '€'
                    availableSeats: 54
                    totalSeats: 100
                    classes:
                      - classType: First
                        price: 120.00
                        availableSeats: 14
                      - classType: Standard
                        price: 65.50
                        availableSeats: 40
                total: 1
                page: 1
                limit: 20
        '400':
          description: Parámetros de búsqueda inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 400
                error: 'Bad Request'
                message: 'El parámetro date debe tener formato AAAA-MM-DD'
                path: '/api/rutas'
                timestamp: '2026-08-27T14:03:00.000Z'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 500
                error: 'Internal Server Error'
                message: 'No se pudieron obtener las rutas'
                path: '/api/rutas'
                timestamp: '2026-08-27T14:03:01.000Z'

  /api/rutas/{rutaId}:
    get:
      tags:
        - Rutas
      summary: Obtener detalle de una ruta
      description: >
        Devuelve el detalle completo de una ruta: tren, estaciones de origen y
        destino, horarios, precios y disponibilidad. Público, no requiere
        token.
      operationId: rutaDetail
      security: []
      parameters:
        - $ref: '#/components/parameters/RutaIdParam'
      responses:
        '200':
          description: Detalle de la ruta solicitada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruta'
              example:
                id: '64e2a1b2c3d4e5f6a7b8c9d0'
                train:
                  code: 'AVE-103'
                  name: 'Renfe S-103 Velaro'
                  type: 'Alta Velocidad'
                  countryCode: 'ES'
                origin:
                  id: 'ES-MAD'
                  name: 'Madrid Puerta de Atocha'
                  city: 'Madrid'
                  countryCode: 'ES'
                destination:
                  id: 'ES-BCN'
                  name: 'Barcelona Sants'
                  city: 'Barcelona'
                  countryCode: 'ES'
                departureAt: '2026-09-01T08:00:00Z'
                arrivalAt: '2026-09-01T10:30:00Z'
                durationMinutes: 150
                basePrice: 65.50
                currency: 'EUR'
                symbol: '€'
                availableSeats: 54
                totalSeats: 100
                classes:
                  - classType: First
                    price: 120.00
                    availableSeats: 14
                  - classType: Standard
                    price: 65.50
                    availableSeats: 40
        '400':
          description: 'rutaId no es un ObjectId válido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 400
                error: 'Bad Request'
                message: 'El rutaId no tiene un formato de ObjectId válido'
                path: '/api/rutas/xyz'
                timestamp: '2026-08-27T14:04:00.000Z'
        '404':
          description: La ruta no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 404
                error: 'Not Found'
                message: 'La ruta 64e2a1b2c3d4e5f6a7b8c9d0 no fue encontrada'
                path: '/api/rutas/64e2a1b2c3d4e5f6a7b8c9d0'
                timestamp: '2026-08-27T14:04:05.000Z'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 500
                error: 'Internal Server Error'
                message: 'No se pudo obtener la ruta'
                path: '/api/rutas/64e2a1b2c3d4e5f6a7b8c9d0'
                timestamp: '2026-08-27T14:04:06.000Z'

  /api/rutas/{rutaId}/asientos:
    get:
      tags:
        - Asientos
      summary: Obtener el mapa de asientos de una ruta
      description: >
        Devuelve el mapa interactivo de asientos de la unidad: vagones, clase,
        disposición (filas y asientos por fila) y el estado de cada asiento
        (`available` u `occupied`). Público, no requiere token.
      operationId: asientosMap
      security: []
      parameters:
        - $ref: '#/components/parameters/RutaIdParam'
      responses:
        '200':
          description: Mapa de asientos de la ruta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMap'
              example:
                rutaId: '64e2a1b2c3d4e5f6a7b8c9d0'
                train:
                  code: 'AVE-103'
                  name: 'Renfe S-103 Velaro'
                  type: 'Alta Velocidad'
                  countryCode: 'ES'
                totalSeats: 100
                availableSeats: 54
                carriages:
                  - carriageNumber: 1
                    classType: First
                    rows: 5
                    seatsPerRow: 4
                    seats:
                      - id: '5f2a1b3c4d5e6f7a8b9c0d01'
                        carriageNumber: 1
                        classType: First
                        row: 1
                        seatNumber: 'A1'
                        status: available
                        price: 120.00
                      - id: '5f2a1b3c4d5e6f7a8b9c0d02'
                        carriageNumber: 1
                        classType: First
                        row: 1
                        seatNumber: 'B1'
                        status: available
                        price: 120.00
                      - id: '5f2a1b3c4d5e6f7a8b9c0d03'
                        carriageNumber: 1
                        classType: First
                        row: 1
                        seatNumber: 'C1'
                        status: occupied
                        price: 120.00
                      - id: '5f2a1b3c4d5e6f7a8b9c0d04'
                        carriageNumber: 1
                        classType: First
                        row: 1
                        seatNumber: 'D1'
                        status: available
                        price: 120.00
                  - carriageNumber: 2
                    classType: Standard
                    rows: 10
                    seatsPerRow: 4
                    seats:
                      - id: '5f2a1b3c4d5e6f7a8b9c0d2e'
                        carriageNumber: 2
                        classType: Standard
                        row: 4
                        seatNumber: 'A4'
                        status: available
                        price: 65.50
                      - id: '5f2a1b3c4d5e6f7a8b9c0d2f'
                        carriageNumber: 2
                        classType: Standard
                        row: 4
                        seatNumber: 'A5'
                        status: available
                        price: 65.50
                      - id: '5f2a1b3c4d5e6f7a8b9c0d30'
                        carriageNumber: 2
                        classType: Standard
                        row: 5
                        seatNumber: 'B5'
                        status: occupied
                        price: 65.50
                      - id: '5f2a1b3c4d5e6f7a8b9c0d31'
                        carriageNumber: 2
                        classType: Standard
                        row: 5
                        seatNumber: 'C5'
                        status: available
                        price: 65.50
        '400':
          description: 'rutaId no es un ObjectId válido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 400
                error: 'Bad Request'
                message: 'El rutaId no tiene un formato de ObjectId válido'
                path: '/api/rutas/xyz/asientos'
                timestamp: '2026-08-27T14:05:00.000Z'
        '404':
          description: La ruta no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 404
                error: 'Not Found'
                message: 'La ruta 64e2a1b2c3d4e5f6a7b8c9d0 no fue encontrada'
                path: '/api/rutas/64e2a1b2c3d4e5f6a7b8c9d0/asientos'
                timestamp: '2026-08-27T14:05:05.000Z'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 500
                error: 'Internal Server Error'
                message: 'No se pudo obtener el mapa de asientos'
                path: '/api/rutas/64e2a1b2c3d4e5f6a7b8c9d0/asientos'
                timestamp: '2026-08-27T14:05:06.000Z'

  /api/rutas/{rutaId}/asientos/{asientoId}/ocupar:
    post:
      tags:
        - Asientos
      summary: Ocupar un asiento (paso previo a la reserva)
      description: >
        Marca un asiento como `occupied` para el usuario autenticado durante el
        flujo de compra, evitando doble reserva. El asiento se devuelve con su
        nuevo estado. Requiere `Authorization: Bearer <token>`. El cuerpo es
        opcional (puede enviarse vacío `{}`).
      operationId: asientoOcupar
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RutaIdParam'
        - $ref: '#/components/parameters/AsientoIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcuparAsientoRequest'
            example: {}
      responses:
        '200':
          description: Asiento ocupado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seat'
              example:
                id: '5f2a1b3c4d5e6f7a8b9c0d2e'
                carriageNumber: 2
                classType: Standard
                row: 4
                seatNumber: 'A4'
                status: occupied
                price: 65.50
        '400':
          description: 'rutaId o asientoId inválidos.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 400
                error: 'Bad Request'
                message: 'El asientoId no tiene un formato de ObjectId válido'
                path: '/api/rutas/64e2a1b2c3d4e5f6a7b8c9d0/asientos/xyz/ocupar'
                timestamp: '2026-08-27T14:06:00.000Z'
        '401':
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 401
                error: 'Unauthorized'
                message: 'Token inválido o expirado'
                path: '/api/rutas/64e2a1b2c3d4e5f6a7b8c9d0/asientos/5f2a1b3c4d5e6f7a8b9c0d2e/ocupar'
                timestamp: '2026-08-27T14:06:05.000Z'
        '403':
          description: El asiento ya se encuentra ocupado por otro pasajero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 403
                error: 'Forbidden'
                message: 'El asiento A4 ya se encuentra ocupado'
                path: '/api/rutas/64e2a1b2c3d4e5f6a7b8c9d0/asientos/5f2a1b3c4d5e6f7a8b9c0d2e/ocupar'
                timestamp: '2026-08-27T14:06:10.000Z'
        '404':
          description: La ruta o el asiento no existen en esa ruta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 404
                error: 'Not Found'
                message: 'El asiento 5f2a1b3c4d5e6f7a8b9c0d2e no pertenece a la ruta 64e2a1b2c3d4e5f6a7b8c9d0'
                path: '/api/rutas/64e2a1b2c3d4e5f6a7b8c9d0/asientos/5f2a1b3c4d5e6f7a8b9c0d2e/ocupar'
                timestamp: '2026-08-27T14:06:15.000Z'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 500
                error: 'Internal Server Error'
                message: 'No se pudo ocupar el asiento'
                path: '/api/rutas/64e2a1b2c3d4e5f6a7b8c9d0/asientos/5f2a1b3c4d5e6f7a8b9c0d2e/ocupar'
                timestamp: '2026-08-27T14:06:20.000Z'

  /api/reservas:
    post:
      tags:
        - Reservas
      summary: Crear una reserva (con pago simulado)
      description: >
        Crea una reserva para uno o más asientos de una ruta. El pasajero `i`
        de `pasajeros` corresponde al asiento `i` de `asientoIds`. El servidor
        valida disponibilidad, ejecuta la pasarela de pago simulada y emite el
        ticket con código QR. Requiere `Authorization: Bearer <token>`.
      operationId: reservasCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
            example:
              rutaId: '64e2a1b2c3d4e5f6a7b8c9d0'
              asientoIds:
                - '5f2a1b3c4d5e6f7a8b9c0d2e'
                - '5f2a1b3c4d5e6f7a8b9c0d2f'
              pasajeros:
                - name: 'María López'
                  document: '35.412.789'
                - name: 'Juan Pérez'
                  document: '38.201.456'
      responses:
        '201':
          description: Reserva creada, pagada y ticket emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
              example:
                id: '64f1b2c3d4e5f6a7b8c9d0e3'
                code: 'BUS-8F2A'
                rutaId: '64e2a1b2c3d4e5f6a7b8c9d0'
                train:
                  code: 'AVE-103'
                  name: 'Renfe S-103 Velaro'
                  type: 'Alta Velocidad'
                  countryCode: 'ES'
                origin:
                  id: 'ES-MAD'
                  name: 'Madrid Puerta de Atocha'
                  city: 'Madrid'
                  countryCode: 'ES'
                destination:
                  id: 'ES-BCN'
                  name: 'Barcelona Sants'
                  city: 'Barcelona'
                  countryCode: 'ES'
                departureAt: '2026-09-01T08:00:00Z'
                arrivalAt: '2026-09-01T10:30:00Z'
                seats:
                  - seatId: '5f2a1b3c4d5e6f7a8b9c0d2e'
                    seatNumber: 'A4'
                    carriageNumber: 2
                    classType: Standard
                    passengerName: 'María López'
                    passengerDocument: '35.412.789'
                  - seatId: '5f2a1b3c4d5e6f7a8b9c0d2f'
                    seatNumber: 'A5'
                    carriageNumber: 2
                    classType: Standard
                    passengerName: 'Juan Pérez'
                    passengerDocument: '38.201.456'
                total: 131.00
                currency: 'EUR'
                symbol: '€'
                status: CONFIRMED
                paymentMessage: 'Pago simulado aprobado (gateway OK)'
                qr: 'BUSYAHU|BUS-8F2A|AVE-103|2026-09-01T08:00:00Z|A4,A5|131.00|EUR'
                createdAt: '2026-08-27T14:03:22.123Z'
        '400':
          description: 'Cuerpo inválido, asientos no disponibles o datos incompletos.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 400
                error: 'Bad Request'
                message: 'El asiento A4 no está disponible para reservar'
                path: '/api/reservas'
                timestamp: '2026-08-27T14:03:30.000Z'
        '401':
          description: Token ausente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 401
                error: 'Unauthorized'
