components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token JWT obtenido en POST /api/auth/login. Formato: Authorization: Bearer <token>.'

  parameters:
    RutaIdParam:
      name: rutaId
      in: path
      required: true
      description: 'Identificador único de la ruta (viaje). ObjectId de MongoDB de 24 caracteres hexadecimales.'
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
      example: '64e2a1b2c3d4e5f6a7b8c9d0'
    AsientoIdParam:
      name: asientoId
      in: path
      required: true
      description: 'Identificador único del asiento dentro de la ruta. ObjectId de MongoDB de 24 caracteres hexadecimales.'
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
      example: '5f2a1b3c4d5e6f7a8b9c0d2e'
    ReservaIdParam:
      name: reservaId
      in: path
      required: true
      description: 'Identificador único de la reserva. ObjectId de MongoDB de 24 caracteres hexadecimales.'
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
      example: '64f1b2c3d4e5f6a7b8c9d0e3'

  schemas:
    Role:
      type: string
      enum:
        - user
        - admin
      description: 'Rol del usuario. `admin` se crea por seed; `user` por registro.'
    ClassType:
      type: string
      enum:
        - First
        - Standard
      description: 'Clase del vagón del tren.'
    SeatStatus:
      type: string
      enum:
        - available
        - occupied
      description: 'Estado del asiento: disponible u ocupado.'
    ReservationStatus:
      type: string
      enum:
        - CONFIRMED
        - CANCELLED
      description: 'Estado de una reserva: confirmada o cancelada.'

    ErrorResponse:
      type: object
      description: 'Envoltorio único y obligatorio para todas las respuestas de error (400, 401, 403, 404, 500). Idéntico en ambos backends.'
      required:
        - statusCode
        - error
        - message
        - path
        - timestamp
      properties:
        statusCode:
          type: integer
          description: 'Código HTTP del error (400, 401, 403, 404 o 500).'
          example: 400
        error:
          type: string
          description: 'Frase corta del tipo de error (ej: Bad Request, Unauthorized, Forbidden, Not Found, Internal Server Error).'
          example: 'Bad Request'
        message:
          type: string
          description: 'Descripción legible y accionable del error.'
          example: 'El email ya se encuentra registrado'
        path:
          type: string
          description: 'Ruta de la petición que originó el error.'
          example: '/api/auth/register'
        timestamp:
          type: string
          format: date-time
          description: 'Momento en que ocurrió el error (ISO 8601).'
          example: '2026-08-27T14:00:01.000Z'

    User:
      type: object
      description: 'Usuario del sistema. Nunca se expone el password ni su hash.'
      required:
        - id
        - name
        - email
        - role
        - createdAt
      properties:
        id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
          description: 'ObjectId del usuario.'
          example: '64a1e2d3c4b5a6f7e8d9c0b1'
        name:
          type: string
          minLength: 2
          maxLength: 80
          description: 'Nombre y apellido del usuario.'
          example: 'María López'
        email:
          type: string
          format: email
          description: 'Email único de la cuenta.'
          example: 'maria.lopez@example.com'
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
          description: 'Fecha de creación de la cuenta.'
          example: '2026-08-20T10:00:00.000Z'

    RegisterRequest:
      type: object
      description: 'Cuerpo de POST /api/auth/register.'
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
          description: 'Nombre y apellido del nuevo pasajero.'
          example: 'María López'
        email:
          type: string
          format: email
          description: 'Email único de la cuenta.'
          example: 'maria.lopez@example.com'
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          description: 'Contraseña en texto plano. Se hashea con bcrypt en el backend.'
          example: 'Segura123!'

    LoginRequest:
      type: object
      description: 'Cuerpo de POST /api/auth/login.'
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: 'pasajero@busyahu.com'
        password:
          type: string
          format: password
          example: 'Pasajero123!'

    AuthResponse:
      type: object
      description: 'Respuesta exitosa de login: token JWT + datos del usuario.'
      required:
        - token
        - tokenType
        - expiresIn
        - user
      properties:
        token:
          type: string
          description: 'Token JWT firmado.'
          example: 'eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI2NGExZTJkM2M0YjVhNmY3ZThkOWMwYjEifQ.signature_ejemplo'
        tokenType:
          type: string
          enum:
            - Bearer
          example: 'Bearer'
        expiresIn:
          type: integer
          description: 'Tiempo de expiración del token en segundos.'
          example: 86400
        user:
          $ref: '#/components/schemas/User'

    Station:
      type: object
      description: 'Estación de una red de transporte.'
      required:
        - id
        - name
        - city
        - countryCode
      properties:
        id:
          type: string
          description: 'Código de estación (ej: ES-MAD).'
          example: 'ES-MAD'
        name:
          type: string
          description: 'Nombre oficial de la estación.'
          example: 'Madrid Puerta de Atocha'
        city:
          type: string
          description: 'Ciudad donde se ubica la estación.'
          example: 'Madrid'
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          description: 'Código de país ISO 3166-1 alpha-2.'
          example: 'ES'

    TrainSummary:
      type: object
      description: 'Resumen del tren / unidad en una ruta o reserva.'
      required:
        - code
        - name
        - type
        - countryCode
      properties:
        code:
          type: string
          description: 'Código único del tren (ej: AVE-103).'
          example: 'AVE-103'
        name:
          type: string
          description: 'Nombre del tren.'
          example: 'Renfe S-103 Velaro'
        type:
          type: string
          description: 'Tipo de servicio.'
          example: 'Alta Velocidad'
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          description: 'País de la red a la que pertenece el tren.'
          example: 'ES'

    RutaClass:
      type: object
      description: 'Disponibilidad y precio por clase dentro de una ruta.'
      required:
        - classType
        - price
        - availableSeats
      properties:
        classType:
          $ref: '#/components/schemas/ClassType'
        price:
          type: number
          minimum: 0
          description: 'Precio base del asiento en esa clase.'
          example: 65.5
        availableSeats:
          type: integer
          minimum: 0
          description: 'Asientos disponibles en esa clase.'
          example: 40

    Ruta:
      type: object
      description: 'Ruta / viaje disponible para reservar.'
      required:
        - id
        - train
        - origin
        - destination
        - departureAt
        - arrivalAt
        - durationMinutes
        - basePrice
        - currency
        - symbol
        - availableSeats
        - totalSeats
        - classes
      properties:
        id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
          description: 'ObjectId de la ruta.'
          example: '64e2a1b2c3d4e5f6a7b8c9d0'
        train:
          $ref: '#/components/schemas/TrainSummary'
        origin:
          $ref: '#/components/schemas/Station'
        destination:
          $ref: '#/components/schemas/Station'
        departureAt:
          type: string
          format: date-time
          description: 'Fecha y hora de salida (ISO 8601).'
          example: '2026-09-01T08:00:00Z'
        arrivalAt:
          type: string
          format: date-time
          description: 'Fecha y hora de llegada (ISO 8601).'
          example: '2026-09-01T10:30:00Z'
        durationMinutes:
          type: integer
          minimum: 1
          description: 'Duración del viaje en minutos.'
          example: 150
        basePrice:
          type: number
          minimum: 0
          description: 'Precio base del pasaje.'
          example: 65.5
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: 'Moneda (ISO 4217).'
          example: 'EUR'
        symbol:
          type: string
          description: 'Símbolo monetario.'
          example: '€'
        availableSeats:
          type: integer
          minimum: 0
          description: 'Total de asientos disponibles en la ruta.'
          example: 54
        totalSeats:
          type: integer
          minimum: 1
          description: 'Capacidad total de la unidad.'
          example: 100
        classes:
          type: array
          description: 'Disponibilidad desglosada por clase.'
          items:
            $ref: '#/components/schemas/RutaClass'

    RutasResponse:
      type: object
      description: 'Respuesta paginada de GET /api/rutas.'
      required:
        - data
        - total
        - page
        - limit
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ruta'
        total:
          type: integer
          minimum: 0
          description: 'Total de rutas que coinciden con los filtros (sin paginar).'
          example: 12
        page:
          type: integer
          minimum: 1
          description: 'Página actual.'
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: 'Resultados por página.'
          example: 20

    Seat:
      type: object
      description: 'Asiento individual dentro de un vagón.'
      required:
        - id
        - carriageNumber
        - classType
        - row
        - seatNumber
        - status
        - price
      properties:
        id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
          description: 'ObjectId del asiento.'
          example: '5f2a1b3c4d5e6f7a8b9c0d2e'
        carriageNumber:
          type: integer
          minimum: 1
          description: 'Número de vagón.'
          example: 2
        classType:
          $ref: '#/components/schemas/ClassType'
        row:
          type: integer
          minimum: 1
          description: 'Fila del asiento.'
          example: 4
        seatNumber:
          type: string
          description: 'Código visible del asiento (letra de columna + fila).'
          example: 'A4'
        status:
          $ref: '#/components/schemas/SeatStatus'
        price:
          type: number
          minimum: 0
          description: 'Precio del asiento según clase.'
          example: 65.5

    Carriage:
      type: object
      description: 'Vagón (carriage) con su disposición y sus asientos.'
      required:
        - carriageNumber
        - classType
        - rows
        - seatsPerRow
        - seats
      properties:
        carriageNumber:
          type: integer
          minimum: 1
          description: 'Número de vagón.'
          example: 1
        classType:
          $ref: '#/components/schemas/ClassType'
        rows:
          type: integer
          minimum: 1
          description: 'Cantidad de filas del vagón.'
          example: 5
        seatsPerRow:
          type: integer
          minimum: 1
          description: 'Asientos por fila.'
          example: 4
        seats:
          type: array
          description: 'Lista de asientos del vagón.'
          items:
            $ref: '#/components/schemas/Seat'

    SeatMap:
      type: object
      description: 'Mapa de asientos de una ruta. Se corresponde con la colección `trains` y su configuración de carriages.'
      required:
        - rutaId
        - train
        - totalSeats
        - availableSeats
        - carriages
      properties:
        rutaId:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
          description: 'ObjectId de la ruta a la que pertenece el mapa.'
          example: '64e2a1b2c3d4e5f6a7b8c9d0'
        train:
          $ref: '#/components/schemas/TrainSummary'
        totalSeats:
          type: integer
          minimum: 1
          description: 'Capacidad total de la unidad.'
          example: 100
        availableSeats:
          type: integer
          minimum: 0
          description: 'Asientos disponibles.'
          example: 54
        carriages:
          type: array
          description: 'Vagones de la unidad con su mapa de asientos.'
          items:
            $ref: '#/components/schemas/Carriage'

    OcuparAsientoRequest:
      type: object
      description: >
        Cuerpo opcional de POST /api/rutas/{rutaId}/asientos/{asientoId}/ocupar.
        Puede enviarse vacío ({}); la ocupación se asocia al usuario autenticado.
      properties:
        reason:
          type: string
          maxLength: 100
          description: 'Motivo opcional de la ocupación (uso interno / auditoría).'
          example: 'Selección del pasajero durante la compra'
      example:
        reason: 'Selección del pasajero durante la compra'

    Passenger:
      type: object
      description: 'Pasajero asociado a un asiento en una reserva.'
      required:
        - name
        - document
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          description: 'Nombre y apellido del pasajero.'
          example: 'María López'
        document:
          type: string
          minLength: 4
          maxLength: 40
          description: 'Documento de identidad (DNI, DNI-pasaporte, etc.).'
          example: '35.412.789'
        email:
          type: string
          format: email
          description: 'Contacto opcional del pasajero.'
          example: 'maria.lopez@example.com'

    ReservationRequest:
      type: object
      description: 'Cuerpo de POST /api/reservas. El pasajero `i` corresponde al asiento `i` (mismo orden en ambos arreglos).'
      required:
        - rutaId
        - asientoIds
        - pasajeros
      properties:
        rutaId:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
          description: 'ObjectId de la ruta a reservar.'
          example: '64e2a1b2c3d4e5f6a7b8c9d0'
        asientoIds:
          type: array
          description: 'IDs de los asientos a reservar (1 a 8).'
          minItems: 1
          maxItems: 8
          items:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example:
            - '5f2a1b3c4d5e6f7a8b9c0d2e'
            - '5f2a1b3c4d5e6f7a8b9c0d2f'
        pasajeros:
          type: array
          description: 'Un pasajero por asiento, en el MISMO ORDEN que asientoIds. La cantidad debe coincidir.'
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/Passenger'

    ReservationSeat:
      type: object
      description: 'Asiento reservado con su pasajero asignado.'
      required:
        - seatId
        - seatNumber
        - carriageNumber
        - classType
        - passengerName
        - passengerDocument
      properties:
        seatId:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
          description: 'ObjectId del asiento reservado.'
          example: '5f2a1b3c4d5e6f7a8b9c0d2e'
        seatNumber:
          type: string
          description: 'Código visible del asiento.'
          example: 'A4'
        carriageNumber:
          type: integer
          minimum: 1
          description: 'Número de vagón.'
          example: 2
        classType:
          $ref: '#/components/schemas/ClassType'
        passengerName:
          type: string
          description: 'Nombre y apellido del pasajero.'
          example: 'María López'
        passengerDocument:
          type: string
          description: 'Documento del pasajero.'
          example: '35.412.789'

    Reservation:
      type: object
      description: 'Reserva emitida con ticket QR.'
      required:
        - id
        - code
        - rutaId
        - train
        - origin
        - destination
        - departureAt
        - arrivalAt
        - seats
        - total
        - currency
        - symbol
        - status
        - paymentMessage
        - qr
        - createdAt
      properties:
        id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
          description: 'ObjectId de la reserva.'
          example: '64f1b2c3d4e5f6a7b8c9d0e3'
        code:
          type: string
          description: 'Código alfanumérico de la reserva / ticket (ej: BUS-8F2A).'
          example: 'BUS-8F2A'
        rutaId:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
          description: 'ObjectId de la ruta reservada.'
          example: '64e2a1b2c3d4e5f6a7b8c9d0'
        train:
          $ref: '#/components/schemas/TrainSummary'
        origin:
          $ref: '#/components/schemas/Station'
        destination:
          $ref: '#/components/schemas/Station'
        departureAt:
          type: string
          format: date-time
          example: '2026-09-01T08:00:00Z'
        arrivalAt:
          type: string
          format: date-time
          example: '2026-09-01T10:30:00Z'
        seats:
          type: array
          description: 'Asientos reservados con sus pasajeros.'
          items:
            $ref: '#/components/schemas/ReservationSeat'
        total:
          type: number
          minimum: 0
          description: 'Monto total de la reserva.'
          example: 131.0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: 'Moneda (ISO 4217).'
          example: 'EUR'
        symbol:
          type: string
          description: 'Símbolo monetario.'
          example: '€'
        status:
          $ref: '#/components/schemas/ReservationStatus'
        paymentMessage:
          type: string
          description: 'Resultado de la pasarela de pago simulada.'
          example: 'Pago simulado aprobado (gateway OK)'
        qr:
          type: string
          description: 'Contenido codificado que el frontend renderiza como ticket QR (formato SVG/QR).'
          example: 'BUSYAHU|BUS-8F2A|AVE-103|2026-09-01T08:00:00Z|A4,A5|131.00|EUR'
        createdAt:
          type: string
          format: date-time
          description: 'Momento de creación de la reserva.'
          example: '2026-08-27T14:03:22.123Z'

    ReservationsResponse:
      type: object
      description: 'Respuesta paginada/lista de GET /api/reservas.'
      required:
        - data
        - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Reservation'
        total:
          type: integer
          minimum: 0
          description: 'Cantidad total de reservas del usuario.'
          example: 3

    DeleteReservationResponse:
      type: object
      description: 'Respuesta de DELETE /api/reservas/{reservaId}: mensaje + reserva cancelada.'
      required:
        - message
        - reservation
      properties:
        message:
          type: string
          description: 'Mensaje de confirmación.'
          example: 'Reserva BUS-8F2A cancelada correctamente. Los asientos fueron liberados.'
        reservation:
          $ref: '#/components/schemas/Reservation'

    AdminReport:
      type: object
      description: 'Reporte estadístico general (solo rol admin).'
      required:
        - generatedAt
        - totalReservations
        - totalRevenue
        - reservationsConfirmed
        - reservationsCancelled
        - averageOccupancy
        - seatsSold
        - reservationsByClass
        - reservationsByRoute
        - topRoutes
      properties:
        generatedAt:
          type: string
          format: date-time
          description: 'Momento en que se generó el reporte.'
          example: '2026-08-27T14:05:00.000Z'
        totalReservations:
          type: integer
          minimum: 0
          description: 'Total de reservas registradas.'
          example: 348
        totalRevenue:
          type: number
          minimum: 0
          description: 'Ingreso total acumulado.'
          example: 25476.5
        reservationsConfirmed:
          type: integer
          minimum: 0
          description: 'Reservas confirmadas.'
          example: 300
        reservationsCancelled:
          type: integer
          minimum: 0
          description: 'Reservas canceladas.'
          example: 48
        averageOccupancy:
          type: number
          minimum: 0
          maximum: 100
          description: 'Ocupación promedio de asientos en porcentaje (0-100).'
          example: 78.5
        seatsSold:
          type: integer
          minimum: 0
          description: 'Asientos vendidos en total.'
          example: 610
        reservationsByClass:
          type: array
          description: 'Ventas desglosadas por clase.'
          items:
            type: object
            required:
              - classType
              - quantity
            properties:
              classType:
                $ref: '#/components/schemas/ClassType'
              quantity:
                type: integer
                minimum: 0
                description: 'Asientos vendidos en esa clase.'
                example: 525
        reservationsByRoute:
          type: array
          description: 'Ventas desglosadas por ruta.'
          items:
            type: object
            required:
              - rutaId
              - train
              - totalReserved
              - seatsSold
              - revenue
            properties:
              rutaId:
                type: string
                pattern: '^[a-fA-F0-9]{24}$'
                example: '64e2a1b2c3d4e5f6a7b8c9d0'
              train:
                type: string
                description: 'Código del tren.'
                example: 'AVE-103'
              totalReserved:
                type: integer
                minimum: 0
                description: 'Reservas registradas para esa ruta.'
                example: 120
              seatsSold:
                type: integer
                minimum: 0
                description: 'Asientos vendidos en esa ruta.'
                example: 96
              revenue:
                type: number
                minimum: 0
                description: 'Ingreso generado por esa ruta.'
                example: 10250.5
        topRoutes:
          type: array
          description: 'Rutas más vendidas (ranking).'
          items:
            type: object
            required:
              - rutaId
              - train
              - bookings
              - revenue
            properties:
              rutaId:
                type: string
                pattern: '^[a-fA-F0-9]{24}$'
                example: '64e2a1b2c3d4e5f6a7b8c9d0'
              train:
                type: string
                description: 'Código del tren.'
                example: 'AVE-103'
              bookings:
                type: integer
                minimum: 0
                description: 'Cantidad de reservas de la ruta.'
                example: 64
              revenue:
                type: number
                minimum: 0
                description: 'Ingreso generado por la ruta.'
                example: 5840.0