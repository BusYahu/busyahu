name: Quality

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-fastapi:
    name: FastAPI tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-fastapi/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Publish coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fastapi
          path: backend-fastapi/coverage.xml
          if-no-files-found: warn

  backend-express:
    name: Express tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-express
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend-express/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Publish coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-express
          path: |
            backend-express/coverage/
            backend-express/coverage-summary.json
          if-no-files-found: warn

  frontend-react:
    name: React lint/build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-react
          path: frontend-react/dist/
          if-no-files-found: warn

  frontend-svelte:
    name: Svelte check/build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-svelte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-svelte/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-svelte
          path: frontend-svelte/dist/
          if-no-files-found: warn

  duplication:
    name: Duplication check (jscpd <= 15%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run jscpd
        run: >
          npx --yes jscpd
          --min-tokens 50
          --threshold 15
          --reporters console
          --ignore "**/node_modules/**,**/.venv/**,**/dist/**,**/coverage/**,**/.git/**"
          backend-fastapi/app backend-express/src frontend-react/src frontend-svelte/src
