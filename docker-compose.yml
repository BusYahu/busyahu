services:
  mongo:
    image: mongo:7.0
    container_name: busyahu-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Admin123!
      MONGO_INITDB_DATABASE: busyahu_db
    volumes:
      - busyahu_mongo_data:/data/db
      - ./database/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  backend-express:
    build: ./backend-express
    container_name: busyahu-express
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGO_URI: mongodb://admin:Admin123!@mongo:27017/busyahu_db?authSource=admin
      JWT_SECRET: super_secret_jwt_key_busyahu_prog3_2026_secure
    depends_on:
      - mongo

  backend-fastapi:
    build: ./backend-fastapi
    container_name: busyahu-fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      MONGO_URI: mongodb://admin:Admin123!@mongo:27017/busyahu_db?authSource=admin
      JWT_SECRET: super_secret_jwt_key_busyahu_prog3_2026_secure
    depends_on:
      - mongo

  frontend-react:
    build: ./frontend-react
    container_name: busyahu-react
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend-express
      - backend-fastapi

  frontend-svelte:
    build: ./frontend-svelte
    container_name: busyahu-svelte
    restart: always
    ports:
      - "5174:5174"
    depends_on:
      - backend-express
      - backend-fastapi

volumes:
  busyahu_mongo_data:
