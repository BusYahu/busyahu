services:
  # -------------------------------------------------------------
  # 1. Base de Datos: MongoDB con persistencia y Seed de 11 países
  # -------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: railworld_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-secretpassword}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-railworld_db}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------------------
  # 2. Backend 1: Node.js + Express (TypeScript)
  # -------------------------------------------------------------
  backend-express:
    build:
      context: ./backend-express
      dockerfile: Dockerfile
    container_name: railworld_backend_express
    restart: always
    environment:
      PORT: ${PORT_EXPRESS:-4000}
      MONGO_URI: ${MONGO_URI:-mongodb://admin:secretpassword@mongo:27017/railworld_db?authSource=admin}
      DATABASE_NAME: ${MONGO_INITDB_DATABASE:-railworld_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_railworld_key_2026}
      CORS_ORIGIN: "*"
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASSWORD:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-BusYahu Rail}
    ports:
      - "${PORT_EXPRESS:-4000}:4000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -------------------------------------------------------------
  # 3. Backend 2: Python + FastAPI
  # -------------------------------------------------------------
  backend-fastapi:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    container_name: railworld_backend_fastapi
    restart: always
    environment:
      PORT: ${PORT_FASTAPI:-8000}
      MONGO_URI: ${MONGO_URI:-mongodb://admin:secretpassword@mongo:27017/railworld_db?authSource=admin}
      DATABASE_NAME: ${MONGO_INITDB_DATABASE:-railworld_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_railworld_key_2026}
      CORS_ORIGIN: "*"
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-${EMAIL_USER:-}}
      SMTP_PASS: ${SMTP_PASS:-${SMTP_PASSWORD:-${EMAIL_PASS:-}}}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-${SMTP_PASS:-${EMAIL_APP_PASSWORD:-}}}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-BusYahu Rail}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    ports:
      - "${PORT_FASTAPI:-8000}:8000"
    volumes:
      - ./backend-fastapi/app:/app/app
      - ./backend-fastapi/test_smtp.py:/app/test_smtp.py
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -------------------------------------------------------------
  # 4. Frontend 1: React 19 + Vite + Tailwind
  # -------------------------------------------------------------
  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: railworld_frontend_react
    restart: always
    ports:
      - "${PORT_REACT:-5173}:5173"
    depends_on:
      backend-express:
        condition: service_healthy
      backend-fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -------------------------------------------------------------
  # 5. Frontend 2: Svelte 5 + Vite + Tailwind
  # -------------------------------------------------------------
  frontend-svelte:
    build:
      context: ./frontend-svelte
      dockerfile: Dockerfile
    container_name: railworld_frontend_svelte
    restart: always
    ports:
      - "${PORT_SVELTE:-5174}:80"
    depends_on:
      backend-express:
        condition: service_healthy
      backend-fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongo_data:
    name: railworld_mongo_volume